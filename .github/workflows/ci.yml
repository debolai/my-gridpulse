---
name: ci

"on":
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read  # least privilege for the workflow token

jobs:
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # scan every commit, not just the tip
      - name: gitleaks over the full history
        run: make secrets-history
  lint-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked      # fails if uv.lock is out of date
      - run: make lint
      - run: make test
